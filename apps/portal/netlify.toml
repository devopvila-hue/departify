plugins = []
headers = []

[dev]
command = "pnpm --filter @departify/portal dev --host 0.0.0.0"
port = 8888
targetPort = 5173

[functions]

[functions."*"]

[build]
# Netlify resolves this path relative to the portal package base directory.
# Using apps/portal/dist here duplicates the base during Netlify builds.
publish = "dist"
publishOrigin = "config"
commandOrigin = "config"
command = "pnpm --filter @departify/portal build"

[build.environment]
NODE_VERSION = "22"
PNPM_VERSION = "9.15.0"

[build.processing]

[build.processing.css]

[build.processing.html]

[build.processing.images]

[build.processing.js]

[build.services]

# API proxy → Railway
[[redirects]]
from = "/api/*"
to = "https://api.departify.app/api/:splat"
status = 200
force = true

# SPA fallback — siempre después del proxy API
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
