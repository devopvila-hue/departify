plugins = []
headers = []

# Monorepo canonical Netlify config.
# Lives at the REPO ROOT so Netlify runs commands with the full pnpm
# workspace context (apps/*, packages/*) and resolves the @departify/portal
# filter. Base directory is then `apps/portal` so Vite + the publish dir
# resolve to the same physical location.

[dev]
command = "pnpm --filter @departify/portal dev --host 0.0.0.0"
port = 8888
targetPort = 5173

[build]
# Run from the REPO ROOT so pnpm can resolve the workspace filter
# (@departify/portal). Publish directory is then expressed as a path
# RELATIVE TO THE REPO ROOT so Netlify finds apps/portal/dist.
base = "."
command = "pnpm --filter @departify/portal build"
publish = "apps/portal/dist"
publishOrigin = "config"
commandOrigin = "config"

[build.environment]
NODE_VERSION = "22"
PNPM_VERSION = "9.15.0"

[functions]

[functions."*"]

[build.processing]

[build.processing.css]

[build.processing.html]

[build.processing.images]

[build.processing.js]

[build.services]

# API proxy → Railway
[[redirects]]
from = "/api/*"
to = "https://api.departify.app/api/:splat"
status = 200
force = true

# SPA fallback — siempre después del proxy API
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
